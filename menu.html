<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Menu · Nakhon Luang Thai Kitchen (Prototype)</title>
  <link rel="icon" type="image/png" href="assets/nltk-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       Tokens (match live site + homepage prototype)
       ========================================================== */
    :root {
      --cream: #F0E6C8;
      --cream-light: #FDF8EE;
      --cream-deep: #E0D5B8;
      --brown: #4F2D1D;
      --brown-hover: #3A2000;
      --brown-deep: #3D1F06;
      --gold: #EABC53;
      --gold-hover: #C99A38;
      --gold-soft: #F2D285;
      --ink: #1A1614;
      --ink-soft: #4F2D1D;
      --ink-mute: #7A6A5A;
      --serif: 'Roboto Slab', Georgia, serif;
      --sans: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --eyebrow: 'Plus Jakarta Sans', 'Roboto', sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow-1: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-2: 0 8px 24px rgba(0,0,0,0.08);
      --shadow-3: 0 20px 50px rgba(0,0,0,0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      color: var(--ink-soft);
      background: var(--cream);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; height: auto; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ==========================================================
       SHARED · Nav (same identity across 3 variants)
       ========================================================== */
    .m-nav {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 40px;
      background: var(--cream-light);
      border-bottom: 1px solid rgba(79,45,29,0.08);
    }
    .m-nav-brand { display: flex; align-items: center; gap: 14px; }
    .m-nav-brand img { height: 44px; width: auto; display: block; }
    .m-nav-brand-sub {
      font-family: var(--eyebrow);
      font-size: 10px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--ink-mute);
      align-self: center;
    }
    .m-nav-links { display: flex; gap: 22px; align-items: center; }
    .m-nav-links a {
      font-size: 14px;
      color: var(--ink-soft);
      transition: color 150ms ease-out;
    }
    .m-nav-links a:hover { color: var(--brown); }
    .m-nav-links a.is-active { color: var(--brown); font-weight: 600; }
    .m-nav-links a.m-nav-order {
      background: var(--brown);
      color: var(--cream-light);
      padding: 11px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      transition: background 180ms ease-out, transform 180ms var(--ease-out);
    }
    .m-nav-links a.m-nav-order:hover { background: var(--brown-hover); color: var(--cream-light); transform: translateY(-1px); }

    @media (max-width: 780px) {
      .m-nav { padding: 12px 18px; }
      .m-nav-brand-sub { display: none; }
      .m-nav-links a:not(.m-nav-order) { display: none; }
    }

    /* ==========================================================
       SHARED · Mobile order bar (all variants)
       ========================================================== */
    .m-mobile-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--brown);
      color: var(--cream-light);
      padding: 14px;
      text-align: center;
      font-weight: 600;
      z-index: 100;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.10);
    }
    @media (max-width: 780px) { .m-mobile-bar { display: block; } }

    /* ==========================================================
       VARIANT 1 · EDITORIAL (photo-forward, slow scroll)
       ========================================================== */
    .v1 { background: var(--cream); }

    .v1-hero {
      position: relative;
      min-height: 60vh;
      padding: 100px 40px 80px;
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
      background: var(--cream);
    }
    .v1-hero-bg {
      position: absolute; inset: 0;
      background: url('assets/nl10b-ritual.jpg') center/cover no-repeat;
      opacity: 0.30;
      filter: saturate(1.1);
    }
    .v1-hero-scrim {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(240,230,200,0.20) 0%, rgba(240,230,200,0.85) 100%);
    }
    .v1-hero-inner { position: relative; max-width: 780px; }
    .v1-hero-eyebrow {
      font-family: var(--eyebrow);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-hover);
      margin-bottom: 22px;
    }
    .v1-hero-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(48px, 7vw, 96px);
      line-height: 1.02;
      color: var(--brown-deep);
      letter-spacing: -0.015em;
    }
    .v1-hero-sub {
      font-family: var(--serif);
      font-weight: 300;
      font-style: italic;
      font-size: clamp(18px, 2vw, 22px);
      color: var(--ink-soft);
      margin-top: 22px;
      line-height: 1.5;
    }
    .v1-hero-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 38px;
      flex-wrap: wrap;
    }
    .v1-hero-actions .btn-primary {
      background: var(--brown);
      color: var(--cream-light);
      padding: 15px 32px;
      border-radius: 999px;
      font-weight: 600;
      transition: background 180ms ease-out, transform 180ms var(--ease-out);
    }
    .v1-hero-actions .btn-primary:hover { background: var(--brown-hover); transform: translateY(-2px); }
    .v1-hero-actions .btn-ghost {
      color: var(--brown);
      padding: 15px 26px;
      border-radius: 999px;
      border: 1.5px solid rgba(79,45,29,0.25);
      font-weight: 500;
      transition: border-color 150ms ease-out, background 180ms ease-out;
    }
    .v1-hero-actions .btn-ghost:hover { border-color: var(--brown); background: rgba(255,255,255,0.45); }

    /* Sticky category chip rail */
    .v1-chiprail {
      position: sticky;
      top: 72px;
      z-index: 90;
      background: rgba(253,248,238,0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(79,45,29,0.08);
      padding: 12px 24px;
    }
    .v1-chiprail-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .v1-chiprail-scroll::-webkit-scrollbar { display: none; }
    .v1-chip {
      flex: 0 0 auto;
      padding: 7px 15px;
      border-radius: 999px;
      background: transparent;
      color: var(--ink-mute);
      font-size: 13px;
      border: 1px solid rgba(79,45,29,0.14);
      transition: all 150ms ease-out;
      white-space: nowrap;
    }
    .v1-chip:hover, .v1-chip.is-active { color: var(--brown-deep); background: var(--cream-deep); border-color: var(--brown); }

    /* Category section */
    .v1-cat {
      position: relative;
      padding: 100px 0 0;
    }
    .v1-cat-photo {
      position: relative;
      height: 46vh;
      min-height: 340px;
      overflow: hidden;
    }
    .v1-cat-photo::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(30,20,15,0) 30%, rgba(30,20,15,0.55) 100%);
    }
    .v1-cat-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.06);
      transition: transform 8000ms ease-out;
    }
    .v1-cat.in-view .v1-cat-photo img { transform: scale(1); }
    .v1-cat-photo-label {
      position: absolute;
      bottom: 30px;
      left: 40px;
      right: 40px;
      color: var(--cream-light);
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }
    .v1-cat-photo-label h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(38px, 5.4vw, 72px);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .v1-cat-photo-label .count {
      font-family: var(--eyebrow);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.85;
      padding-bottom: 12px;
    }

    .v1-cat-body {
      max-width: 1180px;
      margin: 0 auto;
      padding: 70px 40px 30px;
    }
    .v1-cat-featured {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 42px;
      margin-bottom: 60px;
    }
    .v1-cat-featured.count-1 { grid-template-columns: minmax(280px, 520px); justify-content: center; }
    .v1-cat-featured.count-2 { grid-template-columns: repeat(2, minmax(280px, 460px)); justify-content: center; }
    .v1-feat {
      display: flex;
      flex-direction: column;
    }
    .v1-feat-img {
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: var(--shadow-2);
      margin-bottom: 20px;
      background: var(--cream-deep);
    }
    .v1-feat-img img { width:100%; height:100%; object-fit: cover; transition: transform 800ms var(--ease-out); }
    .v1-feat:hover .v1-feat-img img { transform: scale(1.04); }
    .v1-feat-name {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      line-height: 1.2;
      color: var(--brown-deep);
      margin-bottom: 8px;
    }
    .v1-feat-desc {
      font-size: 14px;
      font-style: italic;
      color: var(--ink-mute);
      line-height: 1.55;
      margin-bottom: 12px;
      min-height: 3em;
    }
    .v1-feat-price {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 20px;
      color: var(--brown);
    }

    .v1-cat-list-head {
      font-family: var(--eyebrow);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-mute);
      border-bottom: 1px solid rgba(79,45,29,0.14);
      padding-bottom: 14px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .v1-cat-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 4px 60px;
    }
    .v1-list-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px dotted rgba(79,45,29,0.18);
    }
    .v1-list-name {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 16px;
      color: var(--brown-deep);
    }
    .v1-list-price {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 15px;
      color: var(--ink-mute);
    }
    .v1-cat-cta {
      margin-top: 46px;
      text-align: right;
    }
    .v1-cat-cta a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--eyebrow);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brown);
      padding-bottom: 4px;
      border-bottom: 1.5px solid var(--gold);
      transition: color 150ms ease-out, border-color 150ms ease-out;
    }
    .v1-cat-cta a:hover { color: var(--brown-deep); border-color: var(--brown-deep); }

    .v1-foot {
      text-align: center;
      padding: 100px 40px 140px;
      border-top: 1px solid rgba(79,45,29,0.10);
      margin-top: 80px;
      background: var(--cream-light);
    }
    .v1-foot h3 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(28px, 4vw, 42px);
      color: var(--brown-deep);
      margin-bottom: 14px;
      line-height: 1.15;
    }
    .v1-foot p { font-style: italic; color: var(--ink-mute); margin-bottom: 30px; }

    @media (max-width: 780px) {
      .v1-hero { min-height: 50vh; padding: 60px 20px; }
      .v1-cat { padding: 60px 0 0; }
      .v1-cat-photo { height: 34vh; min-height: 260px; }
      .v1-cat-photo-label { left: 20px; right: 20px; bottom: 20px; flex-direction: column; align-items: flex-start; gap: 8px; }
      .v1-cat-body { padding: 40px 20px 20px; }
      .v1-cat-list { grid-template-columns: 1fr; gap: 0; }
    }

    /* ==========================================================
       VARIANT 2 · ORDER NOW (transactional grid)
       ========================================================== */
    .v2 { background: var(--cream-light); }

    .v2-hero {
      padding: 44px 40px 24px;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      flex-wrap: wrap;
    }
    .v2-hero-title-wrap { max-width: 640px; }
    .v2-hero-eyebrow {
      font-family: var(--eyebrow);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-hover);
      margin-bottom: 12px;
    }
    .v2-hero-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(36px, 4.6vw, 56px);
      color: var(--brown-deep);
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .v2-hero-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--ink-soft);
      text-align: right;
    }
    .v2-hero-meta strong { color: var(--brown-deep); font-weight: 600; }
    .v2-hero-meta .open-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4CB050; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 3px rgba(76,176,80,0.18); }

    /* Sticky tab rail */
    .v2-tabrail {
      position: sticky;
      top: 72px;
      z-index: 90;
      background: rgba(253,248,238,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(79,45,29,0.08);
      padding: 0 30px;
    }
    .v2-tabrail-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .v2-tabrail-inner::-webkit-scrollbar { display: none; }
    .v2-tab {
      flex: 0 0 auto;
      padding: 18px 16px;
      background: transparent;
      color: var(--ink-mute);
      font-size: 14px;
      font-weight: 500;
      border: 0;
      border-bottom: 2.5px solid transparent;
      transition: color 150ms ease-out, border-color 200ms ease-out;
      white-space: nowrap;
      position: relative;
    }
    .v2-tab .v2-tab-count {
      font-size: 11px;
      color: var(--ink-mute);
      margin-left: 5px;
      font-weight: 400;
    }
    .v2-tab:hover { color: var(--brown); }
    .v2-tab.is-active { color: var(--brown-deep); border-bottom-color: var(--gold); font-weight: 600; }

    .v2-filters {
      max-width: 1400px;
      margin: 0 auto;
      padding: 22px 40px 6px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .v2-filter-label {
      font-family: var(--eyebrow);
      font-size: 10px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-right: 6px;
    }
    .v2-filter {
      padding: 6px 13px;
      border-radius: 999px;
      background: transparent;
      border: 1px solid rgba(79,45,29,0.16);
      color: var(--ink-soft);
      font-size: 12.5px;
      transition: all 150ms ease-out;
    }
    .v2-filter:hover { border-color: var(--brown); }
    .v2-filter.is-active {
      background: var(--brown);
      color: var(--cream-light);
      border-color: var(--brown);
    }

    .v2-catintro {
      max-width: 1400px;
      margin: 26px auto 8px;
      padding: 0 40px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    .v2-catintro h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(28px, 3.2vw, 38px);
      color: var(--brown-deep);
      letter-spacing: -0.01em;
    }
    .v2-catintro .count {
      font-family: var(--eyebrow);
      font-size: 12px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }

    .v2-grid {
      max-width: 1400px;
      margin: 22px auto 40px;
      padding: 0 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }
    .v2-card {
      display: flex;
      flex-direction: column;
      background: var(--cream-light);
      border: 1px solid rgba(79,45,29,0.10);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 260ms var(--ease-out), box-shadow 260ms var(--ease-out), border-color 200ms ease-out;
      text-align: left;
      padding: 0;
      color: inherit;
    }
    .v2-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-2);
      border-color: rgba(79,45,29,0.20);
    }
    .v2-card-img {
      aspect-ratio: 4/3;
      background: var(--cream-deep);
      overflow: hidden;
      position: relative;
    }
    .v2-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 500ms var(--ease-out); }
    .v2-card:hover .v2-card-img img { transform: scale(1.04); }
    .v2-card-img-fallback {
      background-size: cover;
      background-color: var(--brown-deep);
      transition: filter 500ms var(--ease-out);
    }
    .v2-card:hover .v2-card-img-fallback { filter: brightness(1.06); }
    .v2-card-nopic {
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(234,188,83,0.10), transparent 60%),
        var(--cream);
      position: relative;
      overflow: hidden;
    }
    .v2-card-nopic-mark {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 44px;
      color: var(--brown-deep);
      opacity: 0.14;
      letter-spacing: -0.02em;
    }
    .v2-card-nopic::after {
      content: '';
      position: absolute; left: 24px; right: 24px; bottom: 20px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
      opacity: 0.7;
    }
    .v2-card-body {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .v2-card-name {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 17px;
      color: var(--brown-deep);
      line-height: 1.25;
      margin-bottom: 8px;
      min-height: 2.4em;
    }
    .v2-card-desc {
      font-size: 13px;
      color: var(--ink-mute);
      line-height: 1.5;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.7em;
    }
    .v2-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px dotted rgba(79,45,29,0.16);
    }
    .v2-card-price {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 18px;
      color: var(--brown-deep);
    }
    .v2-card-add {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--brown);
      color: var(--cream-light);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      transition: background 180ms ease-out, transform 180ms var(--ease-out);
    }
    .v2-card-add:hover { background: var(--brown-hover); transform: translateY(-1px); }
    .v2-card-add span { transition: transform 200ms var(--ease-out); }
    .v2-card:hover .v2-card-add span { transform: translateX(3px); }

    .v2-photo-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.55);
      color: var(--cream-light);
      font-family: var(--eyebrow);
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 9px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    @media (max-width: 780px) {
      .v2-hero { padding: 30px 20px 16px; flex-direction: column; align-items: flex-start; }
      .v2-hero-meta { text-align: left; }
      .v2-grid { padding: 0 20px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .v2-card-body { padding: 12px 14px 14px; }
      .v2-card-name { font-size: 15px; }
      .v2-card-desc { display: none; }
      .v2-filters { padding: 16px 20px 4px; }
    }

    /* ==========================================================
       VARIANT 3 · FIELD GUIDE (dense two-pane)
       ========================================================== */
    .v3 { background: var(--cream); }

    .v3-hero {
      padding: 60px 40px 40px;
      max-width: 1400px;
      margin: 0 auto;
      border-bottom: 1px solid rgba(79,45,29,0.10);
    }
    .v3-hero-eyebrow {
      font-family: var(--eyebrow);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-hover);
      margin-bottom: 14px;
    }
    .v3-hero-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(38px, 5vw, 60px);
      color: var(--brown-deep);
      line-height: 1.02;
      letter-spacing: -0.01em;
    }
    .v3-hero-metabar {
      display: flex;
      align-items: center;
      gap: 26px;
      flex-wrap: wrap;
      margin-top: 22px;
      font-size: 13.5px;
      color: var(--ink-soft);
    }
    .v3-hero-metabar strong { color: var(--brown-deep); font-weight: 600; }
    .v3-hero-metabar .dot { color: var(--ink-mute); }
    .v3-hero-metabar a { border-bottom: 1.5px solid var(--gold); font-weight: 500; }
    .v3-hero-metabar .open-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4CB050; margin-right: 6px; vertical-align: 1px; }

    .v3-layout {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 60px;
      padding: 40px 40px 100px;
      align-items: flex-start;
    }

    .v3-toc {
      position: sticky;
      top: 92px;
      max-height: calc(100vh - 100px);
      overflow: auto;
      padding-right: 8px;
    }
    .v3-toc-head {
      font-family: var(--eyebrow);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(79,45,29,0.14);
    }
    .v3-toc-list { display: flex; flex-direction: column; gap: 3px; }
    .v3-toc-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 8px 12px 8px 14px;
      border-radius: 8px;
      color: var(--ink-mute);
      font-size: 14px;
      transition: all 150ms ease-out;
      border-left: 2px solid transparent;
    }
    .v3-toc-item:hover { color: var(--brown-deep); background: rgba(224,213,184,0.35); }
    .v3-toc-item.is-active {
      color: var(--brown-deep);
      font-weight: 600;
      border-left-color: var(--gold);
      background: rgba(234,188,83,0.10);
    }
    .v3-toc-count {
      font-size: 11px;
      color: var(--ink-mute);
      font-variant-numeric: tabular-nums;
    }

    .v3-toc-cta {
      display: block;
      margin-top: 24px;
      padding: 12px 14px;
      background: var(--brown);
      color: var(--cream-light);
      text-align: center;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: background 180ms ease-out;
    }
    .v3-toc-cta:hover { background: var(--brown-hover); }

    .v3-main { min-width: 0; }

    .v3-cat {
      margin-bottom: 74px;
      scroll-margin-top: 100px;
    }
    .v3-cat-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--brown-deep);
    }
    .v3-cat-head h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(28px, 3.4vw, 40px);
      color: var(--brown-deep);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .v3-cat-head .meta {
      font-family: var(--eyebrow);
      font-size: 11px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--ink-mute);
      padding-bottom: 4px;
    }
    .v3-cat-head .meta a { color: var(--brown); border-bottom: 1.5px solid var(--gold); padding-bottom: 2px; }

    .v3-cat-items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 60px;
      row-gap: 2px;
    }
    .v3-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: baseline;
      padding: 14px 0;
      border-bottom: 1px dotted rgba(79,45,29,0.16);
    }
    .v3-item-name-block { min-width: 0; }
    .v3-item-name {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 16px;
      color: var(--brown-deep);
      line-height: 1.28;
    }
    .v3-item-desc {
      font-size: 12.5px;
      color: var(--ink-mute);
      font-style: italic;
      line-height: 1.5;
      margin-top: 3px;
    }
    .v3-item-price {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 15px;
      color: var(--brown);
      font-variant-numeric: tabular-nums;
    }

    /* Inline scattered photos */
    .v3-inline-photo {
      grid-column: span 2;
      margin: 20px 0;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      align-items: center;
      padding: 18px 20px;
      background: var(--cream-light);
      border-left: 3px solid var(--gold);
      border-radius: 4px;
    }
    .v3-inline-photo img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 6px;
    }
    .v3-inline-photo-body {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-soft);
      font-size: 14.5px;
      line-height: 1.6;
    }
    .v3-inline-photo-body strong {
      font-family: var(--serif);
      font-style: normal;
      font-weight: 600;
      color: var(--brown-deep);
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .v3-foot {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px 20px;
      color: var(--ink-mute);
      font-size: 13px;
      font-style: italic;
    }

    @media (max-width: 900px) {
      .v3-layout { grid-template-columns: 1fr; gap: 30px; padding: 30px 20px 80px; }
      .v3-toc {
        position: static;
        max-height: none;
        overflow: visible;
        padding: 0;
        margin-bottom: 20px;
      }
      .v3-toc-list {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
      }
      .v3-toc-item {
        border-left: 0;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        background: var(--cream-deep);
      }
      .v3-toc-item.is-active { border-left: 0; background: var(--brown); color: var(--cream-light); }
      .v3-toc-count { display: none; }
      .v3-toc-cta { margin-top: 10px; }
      .v3-cat-items { grid-template-columns: 1fr; column-gap: 0; }
      .v3-inline-photo { grid-template-columns: 1fr; }
    }

    /* ==========================================================
       PICKER (PICKER.md verbatim)
       ========================================================== */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }
    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }
    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }
    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }

    /* Fade-in on variant swap */
    @keyframes vmount {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    #stage > * { animation: vmount 300ms var(--ease-out) both; }
    @media (prefers-reduced-motion: reduce) {
      #stage > * { animation: none; }
    }
  </style>
</head>
<body>

  <main id="stage" aria-live="polite"></main>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Editorial</button>
    <button class="proto-picker-item">Order Now</button>
    <button class="proto-picker-item">Field Guide</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script src="menu-data.js?v=2"></script>
  <script>
    // ==========================================================
    //  Shared helpers
    // ==========================================================
    const ORDER_URL = 'https://ezoo.app/nakhon-luang';
    const catAnchor = id => `${ORDER_URL}#cat-${id}`;
    const price = cents => cents == null ? '' : `$${(cents/100).toFixed(2)}`;
    const esc = s => (s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
    const cleanName = n => (n||'').replace(/\s+/g,' ').trim();

    // Per-item crop points for category-fallback cards — cycled so N items
    // sharing one category source read as N different close-ups instead of a
    // print-error repeat. Uses left/right/top/bottom bias plus a couple of
    // center variants for coverage of tighter category tiles.
    const FALLBACK_POSITIONS = [
      '30% 30%', '68% 28%', '50% 55%', '25% 72%',
      '75% 68%', '45% 42%', '82% 45%', '18% 45%',
      '58% 22%', '38% 78%'
    ];

    // Category → hero photo (already in prototype/assets/)
    const CAT_PHOTO = {
      "TX4KM3BG39FQP": "assets/nl10b-ritual.jpg",         // Chef's Specials
      "16F5APM2VJFGG": "assets/nl9-evening-board.jpg",    // House Specials
      "GCSWTFR23RFHY": "assets/cat-streetfood.jpg",       // Street Food
      "X70SRDMNC49M0": "assets/cat-appetizers.jpg",       // Appetizers
      "PNK773475JYFJ": "assets/cat-salad.jpg",            // Salad
      "MQS2Q0X44QHXP": "assets/cat-soup.jpg",             // Soup
      "DWYTP5MFQERMW": "assets/nl8-dish-khaosoi.jpg",     // Noodle
      "8DNCWK3FC80V0": "assets/cat-curry.jpg",            // Curry
      "BTZK0VFC74JSC": "assets/cat-entree.jpg",           // Entree
      "KS1B4AZPW5QDG": "assets/cat-friedrice.jpg",        // Fried Rice
      "W25Z03J513ZPJ": "assets/cat-dessert.jpg",          // Dessert
      "2XJ0VRS462KPP": "assets/cat-kids.jpg",             // Kid's Menu
      "7MVYPR339500W": "assets/cat-sides.jpg",            // Sides
      "1N5NA9AR2FBBP": "assets/cat-coldbeverage.jpg",     // Cold Beverage
      "KWNM0YTEX68YW": "assets/cat-hotbeverage.jpg"       // Hot Beverage (stock)
    };

    // Short human descriptor per category (not copy from the live site — factual context)
    const CAT_LINE = {
      "TX4KM3BG39FQP": "Signature plates from Chef Toui, only found here",
      "16F5APM2VJFGG": "The house builds these dishes around one great ingredient",
      "GCSWTFR23RFHY": "What you'd order from a food cart in Bangkok",
      "X70SRDMNC49M0": "Small plates and starters to open the table",
      "PNK773475JYFJ": "Bright, herb-forward salads with lime and chili",
      "MQS2Q0X44QHXP": "Long-simmered broths with lemongrass, galangal, kaffir",
      "DWYTP5MFQERMW": "Rice noodle, egg noodle, khao soi, drunken",
      "8DNCWK3FC80V0": "Red, green, panang, massaman, and the seasonal Kabocha",
      "BTZK0VFC74JSC": "Stir-fried mains built to order over rice",
      "KS1B4AZPW5QDG": "Wok-fried rice, all with your choice of protein",
      "W25Z03J513ZPJ": "Mango sunset, coconut sticky rice, sweet finishes",
      "2XJ0VRS462KPP": "Milder, kid-sized plates the whole table can share",
      "7MVYPR339500W": "Extras and add-ons to round out any order",
      "1N5NA9AR2FBBP": "Iced Thai tea, boba, coconut, calamansi",
      "KWNM0YTEX68YW": "A quiet warm brew to end the meal"
    };

    // ==========================================================
    //  Nav (shared across variants)
    // ==========================================================
    function navHTML() {
      return `
        <nav class="m-nav">
          <a href="/" class="m-nav-brand" aria-label="Nakhon Luang Thai Kitchen home">
            <img src="assets/nltk-logo-site.png" alt="Nakhon Luang Thai Kitchen">
            <span class="m-nav-brand-sub">Colorado Springs</span>
          </a>
          <div class="m-nav-links">
            <a href="https://nakhonluangthaicos.com/">Home</a>
            <a href="https://nakhonluangthaicos.com/menu/" class="is-active">Menu</a>
            <a href="https://nakhonluangthaicos.com/about/">About</a>
            <a href="https://nakhonluangthaicos.com/reservations/">Reservations</a>
            <a href="https://nakhonluangthaicos.com/contact/">Contact</a>
            <a href="${ORDER_URL}" target="_blank" rel="noopener" class="m-nav-order">Order Online</a>
          </div>
        </nav>
        <a href="${ORDER_URL}" target="_blank" rel="noopener" class="m-mobile-bar">Order Online →</a>
      `;
    }

    // ==========================================================
    //  Variant 1 · EDITORIAL
    // ==========================================================
    function variantEditorial() {
      const cats = MENU_DATA.categories;
      const chips = cats.map(c => `<a href="#e-${c.id}" class="v1-chip">${esc(c.name)}</a>`).join('');

      const sections = cats.map(c => {
        const items = MENU_DATA.items_by_category[c.id];
        const withPhotos = items.filter(i => i.photo_live);
        // Featured only when real photos exist — max 3
        const featured = withPhotos.slice(0, Math.min(3, withPhotos.length));
        const featuredIds = new Set(featured.map(i => i.id));
        const listItems = items.filter(i => !featuredIds.has(i.id));

        const featuredBlock = featured.length ? `
          <div class="v1-cat-featured count-${featured.length}">
            ${featured.map(it => `
              <div class="v1-feat">
                <div class="v1-feat-img">
                  <img src="${esc(it.imageUrl)}" alt="${esc(cleanName(it.name))}" loading="lazy">
                </div>
                <div class="v1-feat-name">${esc(cleanName(it.name))}</div>
                <div class="v1-feat-desc">${it.description ? esc(it.description) : '&nbsp;'}</div>
                <div class="v1-feat-price">${price(it.price_cents)}</div>
              </div>
            `).join('')}
          </div>
        ` : '';

        const listHead = featured.length
          ? `<span>The rest of ${esc(c.name)} · ${listItems.length} more</span>`
          : `<span>${esc(c.name)} · ${listItems.length} dish${listItems.length===1?'':'es'}</span>`;

        return `
          <section class="v1-cat" id="e-${c.id}" data-cat-id="${c.id}">
            <div class="v1-cat-photo">
              <img src="${CAT_PHOTO[c.id]}" alt="${esc(c.name)}" loading="lazy">
              <div class="v1-cat-photo-label">
                <h2>${esc(c.name)}</h2>
                <div class="count">${items.length} dish${items.length===1?'':'es'}</div>
              </div>
            </div>
            <div class="v1-cat-body">
              ${CAT_LINE[c.id] ? `<p style="max-width:640px;font-style:italic;color:var(--ink-mute);font-size:16px;margin:-30px 0 46px;padding-left:2px;">${esc(CAT_LINE[c.id])}</p>` : ''}
              ${featuredBlock}
              ${listItems.length ? `
                <div class="v1-cat-list-head">
                  ${listHead}
                  <span>All dishes made to your spice level</span>
                </div>
                <div class="v1-cat-list">
                  ${listItems.map(it => `
                    <div class="v1-list-row">
                      <div class="v1-list-name">${esc(cleanName(it.name))}</div>
                      <div class="v1-list-price">${price(it.price_cents)}</div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
              <div class="v1-cat-cta">
                <a href="${catAnchor(c.id)}" target="_blank" rel="noopener">
                  Order from ${esc(c.name)} →
                </a>
              </div>
            </div>
          </section>
        `;
      }).join('');

      return `
        <div class="v1">
          ${navHTML()}
          <section class="v1-hero">
            <div class="v1-hero-bg"></div>
            <div class="v1-hero-scrim"></div>
            <div class="v1-hero-inner">
              <div class="v1-hero-eyebrow">Our Menu · Colorado Springs</div>
              <h1 class="v1-hero-title">Every dish made fresh, by hand</h1>
              <p class="v1-hero-sub">A hundred and twenty-two ways into real regional Thai cooking, from Chef Toui's home kitchen in Nakhon Luang to a Rockrimmon strip mall</p>
              <div class="v1-hero-actions">
                <a href="${ORDER_URL}" target="_blank" rel="noopener" class="btn-primary">Order Online</a>
                <a href="https://nakhonluangthaicos.com/reservations/" target="_blank" rel="noopener" class="btn-ghost">Reserve a Table</a>
              </div>
            </div>
          </section>
          <div class="v1-chiprail">
            <div class="v1-chiprail-scroll">${chips}</div>
          </div>
          ${sections}
          <section class="v1-foot">
            <h3>Ready to order</h3>
            <p>Pickup only, cooked to order in about the time it takes to drive here</p>
            <a href="${ORDER_URL}" target="_blank" rel="noopener" class="btn-primary" style="background:var(--brown);color:var(--cream-light);padding:15px 32px;border-radius:999px;font-weight:600;display:inline-block;">Order Online</a>
          </section>
        </div>
      `;
    }

    // ==========================================================
    //  Variant 2 · ORDER NOW
    // ==========================================================
    function variantOrderNow() {
      const cats = MENU_DATA.categories;
      const tabs = cats.map((c, i) => {
        const n = MENU_DATA.items_by_category[c.id].length;
        return `<button class="v2-tab${i===0?' is-active':''}" data-cat="${c.id}">${esc(c.name)}<span class="v2-tab-count">${n}</span></button>`;
      }).join('');

      // Category grids all rendered, only the active one shown
      const grids = cats.map((c, i) => {
        const items = MENU_DATA.items_by_category[c.id];
        return `
          <div class="v2-catgrid" data-cat="${c.id}" ${i===0?'':'hidden'}>
            <div class="v2-catintro">
              <h2>${esc(c.name)}</h2>
              <span class="count">${items.length} dish${items.length===1?'':'es'} · from ${price(Math.min(...items.filter(x=>x.price_cents!=null).map(x=>x.price_cents)))}</span>
            </div>
            <div class="v2-grid">
              ${items.map((it, idx) => `
                <a href="${catAnchor(c.id)}" target="_blank" rel="noopener" class="v2-card" aria-label="Order ${esc(cleanName(it.name))}">
                  ${it.photo_live ? `
                    <div class="v2-card-img" data-photo="real">
                      <img src="${esc(it.imageUrl)}" alt="${esc(cleanName(it.name))}" loading="lazy">
                    </div>
                  ` : `
                    <div class="v2-card-img v2-card-img-fallback" data-photo="category" style="background-image:url('${CAT_PHOTO[c.id]}');background-position:${FALLBACK_POSITIONS[idx % FALLBACK_POSITIONS.length]};" role="img" aria-label="${esc(c.name)} category photo — no plated shot of ${esc(cleanName(it.name))} on file"></div>
                  `}
                  <div class="v2-card-body">
                    <div class="v2-card-name">${esc(cleanName(it.name))}</div>
                    <div class="v2-card-desc">${it.description ? esc(it.description) : '&nbsp;'}</div>
                    <div class="v2-card-footer">
                      <span class="v2-card-price">${price(it.price_cents)}</span>
                      <span class="v2-card-add">Order <span>→</span></span>
                    </div>
                  </div>
                </a>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="v2">
          ${navHTML()}
          <section class="v2-hero">
            <div class="v2-hero-title-wrap">
              <div class="v2-hero-eyebrow">Menu · Order for Pickup</div>
              <h1 class="v2-hero-title">Pick a dish, we start cooking</h1>
            </div>
            <div class="v2-hero-meta">
              <div><span class="open-dot"></span><strong>Open now</strong> · closes 8:30pm</div>
              <div>Pickup only · 805 Village Center Dr</div>
              <div>Cash, card, and app</div>
            </div>
          </section>
          <div class="v2-tabrail">
            <div class="v2-tabrail-inner" role="tablist">${tabs}</div>
          </div>
          <div class="v2-filters">
            <span class="v2-filter-label">Filter</span>
            <button class="v2-filter is-active" data-filter="all">All</button>
            <button class="v2-filter" data-filter="photos">With photos</button>
            <button class="v2-filter" data-filter="under20">Under $20</button>
            <button class="v2-filter" data-filter="chefs">Chef's picks</button>
          </div>
          ${grids}
        </div>
      `;
    }

    // ==========================================================
    //  Variant 3 · FIELD GUIDE
    // ==========================================================
    function variantFieldGuide() {
      const cats = MENU_DATA.categories;
      const toc = cats.map(c => {
        const n = MENU_DATA.items_by_category[c.id].length;
        return `<a href="#f-${c.id}" class="v3-toc-item" data-cat="${c.id}"><span>${esc(c.name)}</span><span class="v3-toc-count">${n}</span></a>`;
      }).join('');

      const sections = cats.map(c => {
        const items = MENU_DATA.items_by_category[c.id];
        // Sprinkle one inline photo mid-category if any real photos exist
        const firstPhoto = items.find(i => i.photo_live);
        const insertAt = Math.min(Math.floor(items.length / 2), 4);

        const rows = items.map((it, idx) => {
          const inline = (firstPhoto && it === firstPhoto && items.length >= 4) ? `
            <div class="v3-inline-photo">
              <img src="${esc(it.imageUrl)}" alt="${esc(cleanName(it.name))}" loading="lazy">
              <div class="v3-inline-photo-body">
                <strong>${esc(cleanName(it.name))} · ${price(it.price_cents)}</strong>
                ${it.description ? esc(it.description) : "One of the plates the kitchen photographs and posts."}
              </div>
            </div>
          ` : '';
          const row = `
            <div class="v3-item">
              <div class="v3-item-name-block">
                <div class="v3-item-name">${esc(cleanName(it.name))}</div>
                ${it.description ? `<div class="v3-item-desc">${esc(it.description)}</div>` : ''}
              </div>
              <div class="v3-item-price">${price(it.price_cents)}</div>
            </div>
          `;
          return row + inline;
        }).join('');

        return `
          <section class="v3-cat" id="f-${c.id}" data-cat-id="${c.id}">
            <div class="v3-cat-head">
              <h2>${esc(c.name)}</h2>
              <div class="meta">${items.length} dish${items.length===1?'':'es'} · <a href="${catAnchor(c.id)}" target="_blank" rel="noopener">order this section</a></div>
            </div>
            ${CAT_LINE[c.id] ? `<p style="font-style:italic;color:var(--ink-mute);font-size:14px;margin:-14px 0 22px;">${esc(CAT_LINE[c.id])}</p>` : ''}
            <div class="v3-cat-items">
              ${rows}
            </div>
          </section>
        `;
      }).join('');

      return `
        <div class="v3">
          ${navHTML()}
          <section class="v3-hero">
            <div class="v3-hero-eyebrow">Menu · Everything on one page</div>
            <h1 class="v3-hero-title">The full menu</h1>
            <div class="v3-hero-metabar">
              <span><span class="open-dot"></span><strong>Open now</strong> · closes 8:30pm</span>
              <span class="dot">·</span>
              <span><strong>122 dishes</strong> across 15 categories</span>
              <span class="dot">·</span>
              <span>Pickup only · <a href="${ORDER_URL}" target="_blank" rel="noopener">order online</a></span>
            </div>
          </section>
          <div class="v3-layout">
            <aside class="v3-toc" aria-label="Menu categories">
              <div class="v3-toc-head">Jump to</div>
              <div class="v3-toc-list">${toc}</div>
              <a href="${ORDER_URL}" target="_blank" rel="noopener" class="v3-toc-cta">Order Online →</a>
            </aside>
            <div class="v3-main">${sections}</div>
          </div>
        </div>
      `;
    }

    // ==========================================================
    //  Picker wiring (per PICKER.md — reference implementation)
    // ==========================================================
    const variants = [variantEditorial, variantOrderNow, variantFieldGuide];
    const variantNames = ['Editorial', 'Order Now', 'Field Guide'];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => {
        stage.innerHTML = variants[i]();
        // Post-mount wiring
        wireVariant(i);
      });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      document.title = `Menu · ${variantNames[i]} · Nakhon Luang Thai Kitchen (Prototype)`;
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    // ==========================================================
    //  Per-variant post-mount wiring
    // ==========================================================
    function wireVariant(i) {
      if (i === 0) wireEditorial();
      else if (i === 1) wireOrderNow();
      else if (i === 2) wireFieldGuide();
    }

    // V1 · IntersectionObserver drives the ken-burns + chip highlight
    function wireEditorial() {
      const sections = document.querySelectorAll('.v1-cat');
      const chips = document.querySelectorAll('.v1-chip');
      const chipByCat = new Map();
      chips.forEach(a => chipByCat.set(a.getAttribute('href').slice(3), a));

      const reveal = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) e.target.classList.add('in-view');
        });
      }, { threshold: 0.15 });
      sections.forEach(s => reveal.observe(s));

      const active = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const cat = e.target.getAttribute('data-cat-id');
            chips.forEach(c => c.classList.remove('is-active'));
            chipByCat.get(cat)?.classList.add('is-active');
            // Ensure active chip is visible in the scroll rail
            const chip = chipByCat.get(cat);
            if (chip) chip.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
          }
        });
      }, { rootMargin: '-40% 0px -55% 0px' });
      sections.forEach(s => active.observe(s));
    }

    // V2 · Tab switching + filter chips
    function wireOrderNow() {
      const tabs = document.querySelectorAll('.v2-tab');
      const grids = document.querySelectorAll('.v2-catgrid');
      const filters = document.querySelectorAll('.v2-filter');

      function activateCat(catId) {
        tabs.forEach(t => t.classList.toggle('is-active', t.dataset.cat === catId));
        grids.forEach(g => {
          const on = g.dataset.cat === catId;
          if (on) g.removeAttribute('hidden'); else g.setAttribute('hidden', '');
        });
        applyFilter();
      }
      tabs.forEach(t => t.addEventListener('click', () => activateCat(t.dataset.cat)));

      let currentFilter = 'all';
      function applyFilter() {
        const visibleGrid = document.querySelector('.v2-catgrid:not([hidden])');
        if (!visibleGrid) return;
        visibleGrid.querySelectorAll('.v2-card').forEach(card => {
          const hasPhoto = !!card.querySelector('.v2-card-img[data-photo="real"]');
          const priceText = card.querySelector('.v2-card-price')?.textContent || '';
          const priceNum = parseFloat(priceText.replace(/[^0-9.]/g, '')) || 999;
          let show = true;
          if (currentFilter === 'photos') show = hasPhoto;
          else if (currentFilter === 'under20') show = priceNum > 0 && priceNum < 20;
          else if (currentFilter === 'chefs') {
            const cat = visibleGrid.dataset.cat;
            show = (cat === 'TX4KM3BG39FQP' || cat === '16F5APM2VJFGG');
          }
          card.style.display = show ? '' : 'none';
        });
      }
      filters.forEach(f => f.addEventListener('click', () => {
        currentFilter = f.dataset.filter;
        filters.forEach(x => x.classList.toggle('is-active', x === f));
        applyFilter();
      }));
    }

    // V3 · Scrollspy TOC highlight
    function wireFieldGuide() {
      const sections = document.querySelectorAll('.v3-cat');
      const tocItems = document.querySelectorAll('.v3-toc-item');
      const tocByCat = new Map();
      tocItems.forEach(a => tocByCat.set(a.dataset.cat, a));

      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const cat = e.target.getAttribute('data-cat-id');
            tocItems.forEach(t => t.classList.remove('is-active'));
            tocByCat.get(cat)?.classList.add('is-active');
          }
        });
      }, { rootMargin: '-15% 0px -70% 0px' });
      sections.forEach(s => io.observe(s));
    }

    // ==========================================================
    //  Boot
    // ==========================================================
    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
